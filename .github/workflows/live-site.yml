name: Live site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Navigate live home page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./run-tests.sh
        env:
          BASE_URL: https://sethusrinivasan.github.io/ap-physics/
