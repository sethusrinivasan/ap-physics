name: CI & Code Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build, Verify & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Unit 4 & Regression Guardrails
        run: |
          python3 skills/ap-physics-walkthrough/scripts/verify_unit.py --unit 4

      - name: Run Pytest Test Suite
        run: |
          PYTHONPATH=. pytest tests/ -v
