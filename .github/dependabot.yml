version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "pillow"
        versions: [">= 13.0.0"] # Pillow 13 requires Python 3.11+, repo supports Python 3.10+
