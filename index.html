<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AP Physics C walkthroughs</title>
  <meta name="description" content="Step-by-step AP Physics C walkthroughs. Unit 2 has 90 problems on center of mass, Newton’s laws, gravity, friction, springs, drag, and circular motion." />
  <link rel="canonical" href="https://sethusrinivasan.github.io/ap-physics/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AP Physics C walkthroughs" />
  <meta property="og:description" content="Step-by-step AP Physics C walkthroughs. Unit 2 has 90 problems on center of mass, Newton’s laws, gravity, friction, springs, drag, and circular motion." />
  <meta property="og:url" content="https://sethusrinivasan.github.io/ap-physics/" />
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LearningResource",
  "name": "AP Physics C walkthroughs",
  "description": "Step-by-step AP Physics C walkthroughs. Unit 2 has 90 problems on center of mass, Newton’s laws, gravity, friction, springs, drag, and circular motion.",
  "learningResourceType": "Walkthrough",
  "educationalLevel": "High school",
  "teaches": "AP Physics C Mechanics",
  "inLanguage": "en",
  "url": "https://sethusrinivasan.github.io/ap-physics/",
  "isPartOf": {
    "@type": "WebSite",
    "name": "AP Physics C walkthroughs",
    "url": "https://sethusrinivasan.github.io/ap-physics/"
  }
}
  </script>
  <style>
    :root {
      --bg: #071018; --panel: #102033; --ink: #e8eef6; --muted: #9bb0c7;
      --line: #27415c; --accent: #5ec8ff; --gold: #f0c75e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
      font-family: "Liberation Sans", "Ubuntu", "Segoe UI", sans-serif; }
    body { display: grid; place-items: start center; padding: 24px 16px 40px; }
    .app { width: min(920px, 100%); }
    header h1 { margin: 0; font-size: 26px; font-weight: 700; }
    header p { margin: 8px 0 22px; color: var(--muted); font-size: 14px; line-height: 1.45; }
    h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #132536; }
    .num { white-space: nowrap; color: var(--gold); font-weight: 700; width: 7.5em; }
    .topic { color: var(--accent); font-weight: 700; }
    .blurb { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
    a.open { display: inline-block; border: 1px solid var(--line); background: #132536; color: var(--ink);
      border-radius: 7px; padding: 8px 12px; font-size: 13px; text-decoration: none; white-space: nowrap; }
    a.open:hover { border-color: var(--accent); }
    .hint { margin-top: 16px; color: var(--muted); font-size: 12px; }
    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .page-qr {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: grid;
      justify-items: center;
      width: 136px;
      padding: 6px 6px 4px;
      background: #fff;
      color: #071018;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
    }
    .page-qr img { width: 124px; height: 124px; display: block; }
    .page-qr span {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.2;
    }
    @media (min-width: 901px) {
      body:not(.qr-off) { padding-top: 168px; }
    }
    body.qr-off .page-qr { display: none; }
    @media (max-width: 900px) {
      .page-qr, .qr-toggle { display: none; }
    }
    .qr-toggle {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: #132536;
      color: var(--ink);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .qr-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <h1>AP Physics C walkthroughs</h1>
        <button type="button" class="qr-toggle" id="qrToggle" aria-expanded="true" aria-controls="pageQr">Hide QR</button>
      </div>
      <p>Open a unit, then a problem. Each problem keeps the exam item on screen and has Previous, Contents, and Next.</p>
      <a class="page-qr" id="pageQr" href="https://sethusrinivasan.github.io/ap-physics/" target="_blank" rel="noopener noreferrer" aria-label="QR code to open the walkthrough home on a phone">
        <img src="qr.svg" alt="" width="120" height="120" />
        <span>Scan</span>
      </a>
    </header>
    <h2>Units</h2>
    <table>
      <thead>
        <tr><th>Unit</th><th>Topic</th><th></th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="num">Unit 2</td>
          <td>
            <div class="topic">Topic questions</div>
            <p class="blurb">90 problems. Center of mass, Newton’s laws, gravity, friction, springs, drag, and circular motion.</p>
          </td>
          <td><a class="open" href="unit2/index.html">Open unit</a></td>
        </tr>
      </tbody>
    </table>
  </div>
  <script>
    const qrToggle = document.getElementById("qrToggle");
    function setQrOpen(open) {
      document.body.classList.toggle("qr-off", !open);
      if (qrToggle) {
        qrToggle.setAttribute("aria-expanded", open ? "true" : "false");
        qrToggle.textContent = open ? "Hide QR" : "Show QR";
      }
      try { sessionStorage.setItem("ap-hide-qr", open ? "0" : "1"); } catch (err) {}
    }
    if (qrToggle) {
      setQrOpen(sessionStorage.getItem("ap-hide-qr") !== "1");
      qrToggle.addEventListener("click", () => {
        setQrOpen(document.body.classList.contains("qr-off"));
      });
    }
  </script>
  <script data-goatcounter="https://ap-physics.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
